<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentinel-2 NDVI Time-Series Explorer</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 30px; color: #333; }
        .container { max-width: 650px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        .form-group { display: grid; gap: 15px; margin-bottom: 25px; }
        label { font-weight: bold; }
        input { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #219653; }
        .result { text-align: center; margin-top: 20px; display: none; }
        .error { color: #c0392b; text-align: center; font-weight: bold; }
        img { max-width: 100%; height: auto; border-radius: 4px; border: 1px solid #ddd; margin-top: 15px; }
        .slider-container { margin-top: 20px; background: #fafafa; padding: 15px; border-radius: 6px; border: 1px solid #eee; }
        .slider-container input { width: 100%; cursor: pointer; }
        .year-display { font-size: 18px; font-weight: bold; color: #27ae60; margin-bottom: 10px; }
        #loading { display: none; color: #e67e22; font-weight: bold; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sentinel-2 NDVI Time-Series Explorer</h2>
        <div class="form-group">
            <div>
                <label for="lat">Latitude:</label>
                <input type="number" step="any" id="lat" value="{{ lat }}">
            </div>
            <div>
                <label for="lon">Longitude:</label>
                <input type="number" step="any" id="lon" value="{{ lon }}">
            </div>
            <button onclick="startExplorer()">Start Explorer (2017 - 2026)</button>
        </div>

        <p id="loading">Fetching satellite map from AWS cloud...</p>
        <p id="errorMsg" class="error"></p>

        <div id="result-section" class="result">
            <div class="slider-container">
                <div class="year-display">Year: <span id="year-label">2026</span></div>
                <input type="range" id="yearSlider" min="2017" max="2026" step="1" value="2026">
            </div>
            <img id="ndviImage" src="" alt="NDVI Map">
        </div>
    </div>

    <script>
        let cachedMaps = {};

        async function fetchYear(year) {
            if (cachedMaps[year]) {
                updateImageView(year, cachedMaps[year]);
                return;
            }

            const lat = document.getElementById('lat').value;
            const lon = document.getElementById('lon').value;
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('errorMsg').innerText = '';
            
            try {
                let response = await fetch('/get_ndvi_year', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lat: lat, lon: lon, year: year })
                });
                
                let data = await response.json();
                document.getElementById('loading').style.display = 'none';
                
                if (data.error) {
                    document.getElementById('errorMsg').innerText = data.error;
                } else {
                    cachedMaps[year] = data;
                    updateImageView(year, data);
                    document.getElementById('result-section').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorMsg').innerText = "Failed to connect to server.";
            }
        }

        function updateImageView(year, data) {
            document.getElementById('year-label').innerText = `${year} (Captured: ${data.date})`;
            document.getElementById('ndviImage').src = data.image;
        }

        function startExplorer() {
            cachedMaps = {}; // Clear cache on new coordinates
            document.getElementById('yearSlider.value = 2026;
            fetchYear(2026);
        }

        // Debounced slider handler to fetch data smoothly as user drags
        let timeout = null;
        document.getElementById('yearSlider').addEventListener('input', function() {
            let year = this.value;
            document.getElementById('year-label').innerText = `${year} (Loading...)`;
            
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                fetchYear(year);
            }, 300);
        });
    </script>
</body>
</html>
